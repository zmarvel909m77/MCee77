<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Air Hockey — GAME BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <a id="backApp" class="back" href="/app/#oyin">← Mini App</a>
        <div class="brand">Air Hockey</div>
        <div id="hudScore" class="hud">0 — 0</div>
      </header>

      <canvas id="game" width="360" height="640" aria-label="Air Hockey o‘yini"></canvas>

      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="eyebrow">GAME BOT</p>
          <h1 id="overlayTitle">Air Hockey</h1>
          <p id="overlayText">
            Diskni raqib darvozasiga uring. Online — ball bor; offline — ball yo‘q.
          </p>
          <p id="overlayScore" class="hidden"></p>
          <p id="submitStatus" class="status"></p>

          <div id="modeButtons" class="stack">
            <button type="button" data-mode="ai">Offline — vs AI</button>
            <button type="button" data-mode="local" class="ghost">
              Bir telefonda 2 o‘yinchi
            </button>
            <button type="button" data-mode="online" class="accent">
              Online — random
            </button>
          </div>

          <div id="actionButtons" class="stack hidden">
            <button id="primaryBtn" type="button">Boshlash</button>
            <button id="menuBtn" type="button" class="ghost">Menyu</button>
            <a id="toAppBtn" class="link-btn" href="/app/#oyin">Mini App ga qaytish</a>
          </div>
        </div>
      </div>
    </div>
    <script src="./game.js" type="module"></script>
  </body>
</html>
