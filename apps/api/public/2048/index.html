
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101020">
<title>2048 | MCee77</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:dark;
  --bg:#101020;
  --panel:#1c1b31;
  --muted:#aaa8c5;
  --accent:#9b75ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#30205a,#101020 65%);
  color:#fff;
  font-family:Manrope,sans-serif;
  overscroll-behavior:none;
}

body{
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
  display:flex;
  justify-content:center;
  touch-action:none;
}

.app{
  width:min(100%,460px);
  height:100%;
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding:18px 0 20px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.heading{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:14px;
  transform:translateY(40px);
}

.heading h1{
  font-size:52px;
  line-height:1;
  margin:0;
  font-weight:900;
  letter-spacing:-4px;
}

.stats{
  display:flex;
  gap:8px;
}

.stat{
  background:#292640;
  border:1px solid #ffffff12;
  border-radius:13px;
  padding:8px 12px;
  text-align:center;
  min-width:76px;
}

.stat small{
  display:block;
  color:#aaa6c3;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
}

.stat b{
  font-size:19px;
}

.board-wrap{
  background:#292640;
  border:1px solid #ffffff20;
  border-radius:19px;
  padding:9px;
  box-shadow:0 16px 40px #0006;
  margin:auto 0;
  touch-action:none;
}

.board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:8px;
  aspect-ratio:1;
  touch-action:none;
  overflow:hidden;
  contain:layout paint;
}

.cell{
  border-radius:11px;
  background:#3a3651;
  min-width:0;
  min-height:0;
}

.tile{
  position:absolute;
  top:0;
  left:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  font-size:clamp(22px,7vw,34px);
  font-weight:900;
  color:#51465b;
  z-index:2;
  pointer-events:none;
  will-change:transform;
  transition:
    transform 400ms cubic-bezier(.16,1,.3,1),
    background .08s;
}

/* Yangi raqam o'z katagida paydo bo'ladi */
.tile.spawn{
  animation:tileSpawn 330ms cubic-bezier(.16,1,.3,1) both;
}

@keyframes tileSpawn{
  from{
    opacity:0;
    scale:.35;
  }
  to{
    opacity:1;
    scale:1;
  }
}

.tile.merging{
  animation:mergePop 100ms ease-out;
}

@keyframes mergePop{
  0%{scale:1}
  55%{scale:1.13}
  100%{scale:1}
}

.tile.removing{
  opacity:0;
  scale:.3;
  transition:opacity 140ms ease,scale 140ms ease;
}

.v2{background:#eee4da}
.v4{background:#ede0c8}
.v8{background:#f2b179;color:#fff}
.v16{background:#f59563;color:#fff}
.v32{background:#f67c5f;color:#fff}
.v64{background:#f65e3b;color:#fff}

.v128{
  background:#edcf72;
  color:#fff;
  font-size:clamp(18px,5vw,28px);
}

.v256{
  background:#edcc61;
  color:#fff;
  font-size:clamp(18px,5vw,28px);
}

.v512{
  background:#edc850;
  color:#fff;
  font-size:clamp(18px,5vw,28px);
}

.v1024,.v2048,.vhigh{
  background:linear-gradient(135deg,#b58aff,#7454dc);
  color:#fff;
  font-size:clamp(16px,4.5vw,25px);
}

.overlay{
  position:fixed;
  inset:0;
  background:#090817c9;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  z-index:4;
  touch-action:auto;
}

.dialog{
  width:min(100%,330px);
  background:#24213b;
  border:1px solid #ffffff25;
  border-radius:22px;
  padding:25px;
  text-align:center;
  box-shadow:0 20px 60px #0009;
}

.dialog h2{
  margin:0 0 8px;
  font-size:26px;
}

.dialog p{
  color:#c3bfd8;
  font-size:13px;
}

.action{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px 8px;
  font:800 13px Manrope;
  background:#8c68ef;
  color:#fff;
  margin-top:12px;
  touch-action:manipulation;
}

.foot{
  text-align:center;
  color:#77738f;
  font-size:10px;
  margin-top:auto;
  padding-top:16px;
  pointer-events:none;
}
</style>
</head>

<body>

<main class="app" id="app">

  <div class="heading">
    <h1>2048</h1>
    <div class="stats">
      <div class="stat">
        <small>Ball</small>
        <b id="score">0</b>
      </div>
      <div class="stat">
        <small>Rekord</small>
        <b id="best">0</b>
      </div>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="2048 o‘yin maydoni"></div>
  </div>

  <div class="foot">MCee77 Telegram Mini App</div>

</main>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h2 id="endTitle">O‘yin tugadi</h2>
    <p id="endText">Natija: 0</p>
    <button class="action" id="again">Qayta o‘ynash</button>
  </div>
</div>

<script>
(()=>{
  const tg=window.Telegram?.WebApp;

  try{
    tg?.ready();
    tg?.expand();
    tg?.disableVerticalSwipes?.();
  }catch{}

  const $=id=>document.getElementById(id);
  const boardEl=$('board');
  const app=$('app');

  let board;
  let score=0;
  let best=Number(localStorage.getItem('mc2048_best')||0);
  let over=false;
  let nextId=1;
  let tileNodes=new Map();

  let gameVersion=0;

  const dirs={
    up:[-1,0],
    down:[1,0],
    left:[0,-1],
    right:[0,1]
  };

  $('best').textContent=best;

  for(let i=0;i<16;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    boardEl.appendChild(cell);
  }

  function newTile(value){
    return {
      id:nextId++,
      value
    };
  }

  function fresh(){
    gameVersion++;

    board=Array.from({length:4},()=>Array(4).fill(null));
    score=0;
    over=false;

    tileNodes.forEach(node=>node.remove());
    tileNodes.clear();

    $('overlay').style.display='none';

    spawn();
    spawn();
    render(true);
  }

  function spawn(){
    const empty=[];

    for(let r=0;r<4;r++){
      for(let c=0;c<4;c++){
        if(!board[r][c])empty.push([r,c]);
      }
    }

    if(!empty.length)return;

    const [r,c]=empty[Math.floor(Math.random()*empty.length)];
    board[r][c]=newTile(Math.random()<.9?2:4);
  }

  function positionTile(node,r,c,animate=true){
    const gap=8;
    const size=boardEl.clientWidth;
    const cell=(size-gap*3)/4;

    node.style.width=cell+'px';
    node.style.height=cell+'px';

    const x=c*(cell+gap);
    const y=r*(cell+gap);

    if(!animate){
      node.style.transition='none';
      node.style.transform=`translate3d(${x}px,${y}px,0)`;
      node.getBoundingClientRect();
      node.style.transition='';
      return;
    }

    node.style.transform=`translate3d(${x}px,${y}px,0)`;
  }

  function render(initial=false){
    const activeIds=new Set();

    for(let r=0;r<4;r++){
      for(let c=0;c<4;c++){
        const tile=board[r][c];
        if(!tile)continue;

        activeIds.add(tile.id);

        let node=tileNodes.get(tile.id);
        let isNew=false;

        if(!node){
          node=document.createElement('div');
          node.className='tile';
          node.textContent=tile.value;
          node.style.transition='none';

          boardEl.appendChild(node);
          tileNodes.set(tile.id,node);
          isNew=true;
        }

        node.className='tile v'+(tile.value<=2048?tile.value:'high');
        node.textContent=tile.value;

        positionTile(node,r,c,!(initial||isNew));

        if(isNew){
          requestAnimationFrame(()=>{
            if(node.isConnected){
              node.classList.add('spawn');
            }
          });
        }
      }
    }

    for(const [id,node] of tileNodes){
      if(!activeIds.has(id)){
        node.classList.add('removing');

        setTimeout(()=>{
          if(!node.isConnected)return;
          node.remove();
          tileNodes.delete(id);
        },110);
      }
    }

    $('score').textContent=score;
    $('best').textContent=best;
  }

  function move(dir){
    if(over)return;

    const [dr,dc]=dirs[dir];
    const old=board.map(row=>row.slice());
    const mergedIds=new Set();

    for(let line=0;line<4;line++){
      const cells=[];

      for(let k=0;k<4;k++){
        const r=dr===0?line:(dr===-1?k:3-k);
        const c=dc===0?line:(dc===-1?k:3-k);
        cells.push([r,c]);
      }

      const tiles=cells
        .map(([r,c])=>board[r][c])
        .filter(Boolean);

      const result=[];

      for(let i=0;i<tiles.length;i++){
        const current=tiles[i];
        const next=tiles[i+1];

        if(next&&current.value===next.value){
          current.value*=2;
          score+=current.value;
          mergedIds.add(current.id);
          result.push(current);
          i++;
        }else{
          result.push(current);
        }
      }

      while(result.length<4)result.push(null);

      cells.forEach(([r,c],i)=>{
        board[r][c]=result[i];
      });
    }

    const changed=board.some((row,r)=>
      row.some((tile,c)=>tile!==old[r][c])
    );

    if(!changed)return;

    const currentVersion=gameVersion;

    spawn();

    if(score>best){
      best=score;
      localStorage.setItem('mc2048_best',String(best));
    }

    render();

    for(const id of mergedIds){
      const node=tileNodes.get(id);

      if(node){
        node.classList.remove('merging');
        void node.offsetWidth;
        node.classList.add('merging');
      }
    }

    setTimeout(()=>{
      if(currentVersion!==gameVersion||over)return;

      if(board.flat().some(tile=>tile?.value>=2048)){
        over=true;
        $('endTitle').textContent='2048 ga yetdingiz!';
        $('endText').textContent='Tabriklaymiz. Ball: '+score;
        $('overlay').style.display='flex';

      }else if(!movesLeft()){
        over=true;
        $('endTitle').textContent='O‘yin tugadi';
        $('endText').textContent='Natijangiz: '+score;
        $('overlay').style.display='flex';
      }
    },140);
  }

  function movesLeft(){
    if(board.flat().some(tile=>!tile))return true;

    for(let r=0;r<4;r++){
      for(let c=0;c<4;c++){
        const value=board[r][c]?.value;

        if(
          (r<3&&value===board[r+1][c]?.value)||
          (c<3&&value===board[r][c+1]?.value)
        ){
          return true;
        }
      }
    }

    return false;
  }

  document.addEventListener('keydown',e=>{
    const map={
      ArrowUp:'up',
      ArrowDown:'down',
      ArrowLeft:'left',
      ArrowRight:'right'
    };

    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  });

  let sx=0;
  let sy=0;
  let swiping=false;
  let activePointer=null;

  app.addEventListener('pointerdown',e=>{
    if(over)return;
    if(e.target.closest('button'))return;

    sx=e.clientX;
    sy=e.clientY;
    swiping=true;
    activePointer=e.pointerId;

    try{
      app.setPointerCapture(e.pointerId);
    }catch{}
  });

  app.addEventListener('pointerup',e=>{
    if(!swiping||e.pointerId!==activePointer)return;

    swiping=false;
    activePointer=null;

    if(over)return;

    const dx=e.clientX-sx;
    const dy=e.clientY-sy;

    if(Math.max(Math.abs(dx),Math.abs(dy))<14)return;

    if(Math.abs(dx)>Math.abs(dy)){
      move(dx>0?'right':'left');
    }else{
      move(dy>0?'down':'up');
    }
  });

  app.addEventListener('pointercancel',()=>{
    swiping=false;
    activePointer=null;
  });

  if('ResizeObserver' in window){
    new ResizeObserver(()=>{
      if(!board)return;

      for(let r=0;r<4;r++){
        for(let c=0;c<4;c++){
          const tile=board[r][c];

          if(tile){
            const node=tileNodes.get(tile.id);
            if(node)positionTile(node,r,c,false);
          }
        }
      }
    }).observe(boardEl);
  }

  $('again').onclick=fresh;

  fresh();
})();
</script>

</body>
</html>
