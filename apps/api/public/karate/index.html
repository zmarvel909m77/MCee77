<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Karate — GAME BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="wrap">
      <header class="hud">
        <a class="back" href="/app/#oyinlar" id="backBtn">‹</a>
        <div class="hud-mid">
          <span class="label">Ball</span>
          <strong id="hudScore">0</strong>
        </div>
        <div class="hud-right">
          <span class="label">Rekord</span>
          <strong id="hudBest">0</strong>
        </div>
      </header>

      <div class="energy-wrap" aria-hidden="true">
        <div id="energyBar" class="energy-bar"></div>
      </div>

      <canvas id="game" width="360" height="560"></canvas>

      <div class="hint" id="hint">Chap yoki o‘ng tomonga bosing</div>

      <div id="overlay" class="overlay">
        <div class="card">
          <p class="eyebrow">KARATE</p>
          <h1 id="overlayTitle">Boshlash</h1>
          <p id="overlayText">Novdani to‘g‘ri tomondan choping. Noto‘g‘ri tomon — o‘yin tugaydi.</p>
          <p class="score-line">Ball: <strong id="overlayScore">0</strong></p>
          <p id="submitStatus" class="status"></p>
          <button type="button" id="primaryBtn">O‘ynash</button>
        </div>
      </div>
    </div>
    <script src="./game.js" defer></script>
  </body>
</html>
