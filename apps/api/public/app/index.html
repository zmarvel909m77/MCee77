<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini App</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Asosiy moslashuvlar va ixchamlashtirish */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1015;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Yuqori qismdagi keraksiz elementlar va MCee77 olib tashlandi */
        .top-header, .header-title {
            display: none !important;
        }
        /* Pastki menyu (Tab bar) dizayni va shisha effekti */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8e8e93;
            font-size: 11px;
            font-weight: 500;
        }
        .tab-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            margin-bottom: 3px;
        }
        .tab-item.active {
            color: #007aff;
        }
    </style>
</head>
<body>

    <!-- Asosiy Kontent qismi -->
    <div class="content-container" style="padding: 12px; padding-bottom: 80px;">
        <!-- Sahifalar -->
        <div id="shop-page" class="page">
            <h2 style="font-size: 20px; margin-bottom: 10px;">Do‘kon</h2>
            <!-- Do'kon tarkibi -->
        </div>
    </div>

    <!-- Pastki Navigatsiya Menyu -->
    <div class="tab-bar">
        <a href="#" class="tab-item active" onclick="switchTab('shop')">
            <img src="tab-gift.png.JPG" alt="Do'kon">
            <span>Do‘kon</span>
        </a>
        <a href="#" class="tab-item" onclick="switchTab('games')">
            <img src="tab-game.png.JPG" alt="O'yinlar">
            <span>O‘yinlar</span>
        </a>
        <a href="#" class="tab-item" onclick="switchTab('leaderboard')">
            <img src="tab-cup.png.JPG" alt="Reyting">
            <span>Reyting</span>
        </a>
    </div>

    <script src="app.js"></script>
</body>
</html>
