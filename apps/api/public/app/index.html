<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>GAME BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <p class="brand">GAME BOT</p>
          <p class="brand-sub">Air Hockey · MCee77</p>
        </div>
        <div id="connDot" class="conn" title="Aloqa" aria-label="Aloqa"></div>
      </header>

      <main id="views" class="views">
        <!-- Profil -->
        <section id="view-profil" class="view active" data-view="profil">
          <div class="profile-hero">
            <div class="rink-glow" aria-hidden="true"></div>
            <div class="profile-block">
              <!-- Fixed frame chrome — not user-customizable; photo clips inside -->
              <div class="avatar-frame" aria-hidden="false">
                <button type="button" id="avatarBtn" class="avatar-btn" aria-label="Rasm yuklash">
                  <img id="avatarImg" class="avatar-img hidden" alt="" />
                  <span id="avatarFallback" class="avatar-fallback">
                    <svg viewBox="0 0 48 48" width="40" height="40" fill="currentColor" aria-hidden="true">
                      <circle cx="24" cy="17" r="9"/>
                      <path d="M7 42c1.8-10 9.2-15 17-15s15.2 5 17 15v2H7v-2Z"/>
                    </svg>
                  </span>
                  <span class="avatar-cam" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                      <path d="M9 4.5 7.8 6H5.5A2.5 2.5 0 0 0 3 8.5v9A2.5 2.5 0 0 0 5.5 20h13a2.5 2.5 0 0 0 2.5-2.5v-9A2.5 2.5 0 0 0 18.5 6h-2.3L15 4.5H9Zm3 13a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/>
                    </svg>
                  </span>
                </button>
              </div>
              <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" hidden />

              <div class="nick-row">
                <h1 id="nickDisplay" class="nick">…</h1>
                <button type="button" id="editNickBtn" class="edit-nick-btn" aria-label="Taxallusni tahrirlash">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm18.71-11.04a1 1 0 0 0 0-1.41l-2.51-2.51a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.99-1.66Z"/>
                  </svg>
                </button>
              </div>

              <p id="presenceLine" class="presence-line" aria-live="polite">
                <span class="presence-dot" aria-hidden="true"></span>
                <span id="presenceText">Aloqa…</span>
              </p>

              <p class="game-tag">
                <svg class="puck-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <ellipse cx="12" cy="12" rx="9" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                  <ellipse cx="12" cy="12" rx="4.5" ry="2.6" fill="currentColor" opacity="0.55"/>
                </svg>
                Air Hockey
              </p>

              <div class="stat-row">
                <div>
                  <span class="stat-label">Ball</span>
                  <strong id="statPoints">0</strong>
                </div>
                <div>
                  <span class="stat-label">Reyting</span>
                  <strong id="statRating">1000</strong>
                </div>
                <div>
                  <span class="stat-label">O‘yinlar</span>
                  <strong id="statGames">0</strong>
                </div>
              </div>
            </div>
          </div>

          <div id="nickEditor" class="sheet hidden">
            <label for="nickInput">Taxallus</label>
            <input id="nickInput" maxlength="32" placeholder="Ismingizni yozing" />
            <div class="sheet-actions">
              <button type="button" id="nickCancel" class="ghost">Bekor</button>
              <button type="button" id="nickSave">Saqlash</button>
            </div>
            <p id="nickStatus" class="status"></p>
          </div>

          <p id="profileStatus" class="status center"></p>
        </section>

        <!-- O‘yin -->
        <section id="view-oyin" class="view" data-view="oyin">
          <div class="section-head">
            <h2>O‘yin</h2>
            <p>Raqib tanlang yoki maydonda mashq qiling</p>
          </div>

          <button type="button" id="offlineBtn" class="cta cta-offline">
            <span class="cta-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="7" width="16" height="12" rx="3"/>
                <circle cx="9" cy="13" r="1.2" fill="currentColor" stroke="none"/>
                <circle cx="15" cy="13" r="1.2" fill="currentColor" stroke="none"/>
                <path d="M9 4h6M12 4v3"/>
              </svg>
            </span>
            <span class="cta-copy">
              <strong>Offline</strong>
              <small>Sun’iy intelektga qarshi · ball yo‘q</small>
            </span>
          </button>

          <button type="button" id="local2pBtn" class="cta cta-local">
            <span class="cta-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="7" y="2.5" width="10" height="19" rx="2.2"/>
                <circle cx="12" cy="18.2" r="0.9" fill="currentColor" stroke="none"/>
                <path d="M9.5 6.5h5M9.5 9.5h5"/>
              </svg>
            </span>
            <span class="cta-copy">
              <strong>Bir telefonda 2 o‘yinchi</strong>
              <small>Ikki kishi bitta telefonda · ball yo‘q</small>
            </span>
          </button>

          <button type="button" id="randomBtn" class="cta cta-online">
            <span class="cta-ico cta-ico-globe" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/>
                <path d="M7.2 5.4c1.6 1.4 3.2 3.8 3.2 6.6s-1.6 5.2-3.2 6.6"/>
                <path d="M16.8 5.4C15.2 6.8 13.6 9.2 13.6 12s1.6 5.2 3.2 6.6"/>
              </svg>
            </span>
            <span class="cta-copy">
              <strong>Random online</strong>
              <small>Dunyo bo‘ylab raqib · ball hisoblanadi</small>
            </span>
          </button>

          <div class="list-head">
            <h3>Onlaynlar</h3>
            <span id="onlineCount" class="badge">0</span>
          </div>
          <ul id="onlineList" class="user-list"></ul>
          <p id="onlineEmpty" class="empty hidden">
            <span class="empty-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/>
              </svg>
            </span>
            Hozircha onlayn o‘yinchi yo‘q
          </p>

          <div id="inviteBanner" class="invite-banner hidden">
            <p id="inviteText"></p>
            <div class="sheet-actions">
              <button type="button" id="inviteDecline" class="ghost">Rad etish</button>
              <button type="button" id="inviteAccept">Qabul qilish</button>
            </div>
          </div>
        </section>

        <!-- Reyting -->
        <section id="view-reyting" class="view" data-view="reyting">
          <div class="section-head">
            <h2>Reyting</h2>
            <p>Onlayn o‘yinlar bo‘yicha eng kuchlilar</p>
          </div>
          <ol id="leaderboard" class="board"></ol>
          <p id="boardEmpty" class="empty hidden">
            <span class="empty-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M5 21h4v-8H5zm5 0h4V9h-4zm5 0h4V3h-4z"/>
              </svg>
            </span>
            Reyting hali shakllanmagan
          </p>
          <p id="boardStatus" class="status center"></p>
        </section>
      </main>

      <nav class="tabbar" aria-label="Asosiy menyu">
        <button type="button" class="tab active" data-tab="profil">
          <span class="tab-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-4 0-7.5 2-7.5 4.5V21h15v-2.25c0-2.5-3.5-4.5-7.5-4.5Z"/></svg>
          </span>
          <span>Profil</span>
        </button>
        <button type="button" class="tab" data-tab="oyin">
          <!-- DualSense silhouette: left analog stick (round) + right △○□✕ cluster — no D-pad -->
          <span class="tab-ico tab-ico-pad" aria-hidden="true">
            <svg viewBox="0 0 32 22" width="26" height="18" fill="currentColor">
              <path d="M9.2 3.2h13.6c2.2 0 3.7 1.35 4.25 3.25l1.05 3.55c.55 1.9-.25 3.85-2.05 4.55-1 .4-2.15.15-2.9-.7l-.7-.75H11.55l-.7.75c-.75.85-1.9 1.1-2.9.7-1.8-.7-2.6-2.65-2.05-4.55l1.05-3.55C5.5 4.55 7 3.2 9.2 3.2Z"/>
              <!-- left stick only -->
              <circle cx="10.4" cy="10.1" r="2.55" fill="#0c0c14"/>
              <circle cx="10.4" cy="10.1" r="1.2" fill="currentColor"/>
              <!-- touchpad -->
              <rect x="14" y="5.8" width="4" height="2.6" rx="0.6" fill="#0c0c14" opacity="0.85"/>
              <!-- face buttons -->
              <circle cx="21.6" cy="7.9" r="1.15" fill="#0c0c14"/>
              <circle cx="19.7" cy="9.85" r="1.15" fill="#0c0c14"/>
              <circle cx="23.5" cy="9.85" r="1.15" fill="#0c0c14"/>
              <circle cx="21.6" cy="11.8" r="1.15" fill="#0c0c14"/>
            </svg>
          </span>
          <span>O‘yin</span>
        </button>
        <button type="button" class="tab" data-tab="reyting">
          <span class="tab-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M5 21h4v-8H5zm5 0h4V9h-4zm5 0h4V3h-4z"/></svg>
          </span>
          <span>Reyting</span>
        </button>
      </nav>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
