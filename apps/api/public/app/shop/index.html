<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Do‘kon — AIR HOCKEY</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #07101c;
        --bg1: #12263f;
        --ice: #7ec8ff;
        --text: #f4f8fc;
        --muted: #9db4d0;
        --card: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.12);
        --font: "Manrope", system-ui, sans-serif;
        --display: "Sora", "Manrope", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        color: var(--text);
        font-family: var(--font);
        background:
          radial-gradient(80% 60% at 20% 0%, rgba(126, 200, 255, 0.18), transparent 55%),
          radial-gradient(70% 50% at 100% 20%, rgba(46, 196, 182, 0.12), transparent 50%),
          linear-gradient(165deg, var(--bg1), var(--bg0) 60%);
      }
      body {
        padding: 28px 20px 40px;
        display: grid;
        place-items: center;
      }
      main {
        width: min(420px, 100%);
        padding: 28px 24px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: var(--card);
        backdrop-filter: blur(10px);
        text-align: center;
      }
      .brand {
        margin: 0 0 6px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--ice);
      }
      h1 {
        margin: 0 0 14px;
        font-family: var(--display);
        font-size: 1.7rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 0.98rem;
      }
      p + p {
        margin-top: 12px;
      }
      .back {
        margin-top: 22px;
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 12px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">AIR HOCKEY</p>
      <h1>Do‘kon</h1>
      <p>
        Hozircha do‘kon javonlari bo‘sh — omborimiz yangi resurslar bilan
        to‘ldirilmoqda.
      </p>
      <p>Tez orada bu yerda sovg‘alar va imkoniyatlar paydo bo‘ladi.</p>
      <button type="button" class="back" id="backBtn">O‘yinga qaytish</button>
    </main>
    <script>
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          tg.ready();
          tg.expand();
          try {
            if (typeof tg.disableVerticalSwipes === "function") {
              tg.disableVerticalSwipes();
            }
          } catch (_) {}
        }
        document.getElementById("backBtn").addEventListener("click", function () {
          window.location.href = "../";
        });
      })();
    </script>
  </body>
</html>
