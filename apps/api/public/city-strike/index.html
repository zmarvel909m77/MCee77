<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>City Strike — GAME BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="wrap">
      <header class="hud">
        <a class="back" href="/app/#oyinlar" id="backBtn" aria-label="Orqaga">‹</a>
        <div class="hud-score-block">
          <span class="label">Ball</span>
          <strong id="hudScore">0</strong>
        </div>
        <div class="hud-best-block">
          <span class="label">Rekord</span>
          <strong id="hudBest">0</strong>
        </div>
      </header>

      <div class="meters" aria-hidden="true">
        <div class="meter meter-energy">
          <span class="meter-ico energy-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <path d="M13 2 4 14h7l-1 8 10-14h-7l0-6z" />
            </svg>
          </span>
          <div class="meter-track">
            <div id="energyBar" class="meter-fill energy-fill"></div>
          </div>
        </div>
        <div class="meter meter-multi">
          <div class="meter-track multi-track">
            <div id="multiBar" class="meter-fill multi-fill"></div>
          </div>
          <span class="multi-badge" id="multiBadge">1X</span>
        </div>
      </div>

      <canvas id="game" width="360" height="560"></canvas>

      <div class="hint" id="hint">Chap yoki o‘ng tomonga bosing</div>

      <div id="overlay" class="overlay">
        <div class="card">
          <p class="eyebrow">CITY STRIKE</p>
          <h1 id="overlayTitle">Boshlash</h1>
          <p id="overlayText">
            Minora segmentlarini chap yoki o‘ngdan uring. Xavf siz tomonda
            bo‘lsa — ehtiyot!
          </p>
          <p class="score-line">Ball: <strong id="overlayScore">0</strong></p>
          <p id="submitStatus" class="status"></p>
          <button type="button" id="primaryBtn">O‘ynash</button>
        </div>
      </div>
    </div>
    <script src="./game.js" defer></script>
  </body>
</html>
